[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "snapanswer"
version = "0.1.0"
description = "Screenshot, OCR, and AI answer overlay for Windows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "SnapAnswer contributors" }]
keywords = ["ocr", "screenshot", "llm", "pyqt6", "rapidocr", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
  "PyQt6>=6.7,<7",
  "httpx>=0.27,<1",
  "numpy>=1.24",
  "Pillow>=10",
  "pynput>=1.7.6,<2",
  "rapidocr-onnxruntime>=1.3.24,<2",
  "tomli>=2; python_version < '3.11'",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "ruff>=0.6",
]
build = ["pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/Mu-Jiji/snapanswer"
Issues = "https://github.com/Mu-Jiji/snapanswer/issues"

[project.gui-scripts]
snapanswer = "snapanswer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["snapanswer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: tests that load real OCR/LLM resources",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

